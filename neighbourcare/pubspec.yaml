name: neighbourcare_web
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  provider: ^6.1.0
  file_picker: ^8.0.0
  flutter_map: ^8.3.1
  intl: ^0.20.2
  http: ^1.2.2
  csv: ^6.0.0
  url_launcher: ^6.3.1
  fl_chart: ^1.2.0
  google_fonts: ^8.2.1
  xml: ^6.3.0
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/NotoSansTC-Regular.ttf
    - assets/images/deals/
    - assets/images/stores/
    - assets/images/calgary_night.jpg

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSansTC-Regular.ttf
        - asset: assets/fonts/NotoSansTC-VariableFont_wght.ttf